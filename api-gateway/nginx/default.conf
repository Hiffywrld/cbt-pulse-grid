upstream cbt_pulse_grid_backend {
  server backend:8080;
}

upstream cbt_pulse_grid_identity_service {
  server identity-service:8081;
}

upstream cbt_pulse_grid_examination_service {
  server examination-service:8082;
}

upstream cbt_pulse_grid_monitoring_service {
  server monitoring-service:8083;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 8080;
  server_name _;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/v1/auth/ { proxy_pass http://cbt_pulse_grid_identity_service; include /etc/nginx/proxy_params; }
  location /api/v1/users { proxy_pass http://cbt_pulse_grid_identity_service; include /etc/nginx/proxy_params; }
  location /api/v1/institutions { proxy_pass http://cbt_pulse_grid_identity_service; include /etc/nginx/proxy_params; }
  location /api/v1/audit { proxy_pass http://cbt_pulse_grid_identity_service; include /etc/nginx/proxy_params; }

  location ~ ^/api/v1/student/attempts/[^/]+/heartbeat$ { proxy_pass http://cbt_pulse_grid_monitoring_service; include /etc/nginx/proxy_params; }
  location ~ ^/api/v1/student/attempts/[^/]+/monitoring-events$ { proxy_pass http://cbt_pulse_grid_monitoring_service; include /etc/nginx/proxy_params; }
  location /api/v1/monitoring { proxy_pass http://cbt_pulse_grid_monitoring_service; include /etc/nginx/proxy_params; }
  location /api/v1/webhooks { proxy_pass http://cbt_pulse_grid_monitoring_service; include /etc/nginx/proxy_params; }

  location /api/v1/subjects { proxy_pass http://cbt_pulse_grid_examination_service; include /etc/nginx/proxy_params; }
  location /api/v1/questions { proxy_pass http://cbt_pulse_grid_examination_service; include /etc/nginx/proxy_params; }
  location /api/v1/exams { proxy_pass http://cbt_pulse_grid_examination_service; include /etc/nginx/proxy_params; }
  location /api/v1/student/exams { proxy_pass http://cbt_pulse_grid_examination_service; include /etc/nginx/proxy_params; }
  location /api/v1/student/attempts/ { proxy_pass http://cbt_pulse_grid_examination_service; include /etc/nginx/proxy_params; }
  location /api/v1/results { proxy_pass http://cbt_pulse_grid_examination_service; include /etc/nginx/proxy_params; }

  location /api/ { proxy_pass http://cbt_pulse_grid_backend; include /etc/nginx/proxy_params; }

  location /ws {
    proxy_pass http://cbt_pulse_grid_monitoring_service;
    include /etc/nginx/proxy_params;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /v3/api-docs { proxy_pass http://cbt_pulse_grid_backend; include /etc/nginx/proxy_params; }
  location /swagger-ui { proxy_pass http://cbt_pulse_grid_backend; include /etc/nginx/proxy_params; }
  location = /swagger-ui.html { proxy_pass http://cbt_pulse_grid_backend; include /etc/nginx/proxy_params; }
}
