name: Main CI and GHCR Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  POSTGRES_DB: cbt_pulse_grid
  POSTGRES_USER: cbt_admin
  POSTGRES_PASSWORD: cbt_dev_password
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5433"
  JWT_SECRET: cbt-pulse-grid-ci-test-secret-with-more-than-32-characters
  WEBHOOK_MASTER_KEY: ""

jobs:
  tests:
    name: Service and Frontend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cbt_pulse_grid
          POSTGRES_USER: cbt_admin
          POSTGRES_PASSWORD: cbt_dev_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cbt_admin -d cbt_pulse_grid"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mvn -B -f identity-service/pom.xml test
      - run: mvn -B -f examination-service/pom.xml test
      - run: mvn -B -f monitoring-service/pom.xml test
      - run: mvn -B -f backend/pom.xml test
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:run -- --maxWorkers=1
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  manifests:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Kubernetes manifests offline
        run: |
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary k8s/

  publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: [tests, manifests]
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api-gateway
            context: api-gateway
          - name: identity-service
            context: identity-service
          - name: examination-service
            context: examination-service
          - name: monitoring-service
            context: monitoring-service
          - name: frontend
            context: frontend
          - name: backend
            context: backend
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image namespace
        id: image
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "namespace=${REGISTRY}/${repo}" >> "$GITHUB_OUTPUT"
      - name: Publish ${{ matrix.image.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: |
            ${{ steps.image.outputs.namespace }}/cbt-pulse-grid-${{ matrix.image.name }}:${{ github.sha }}
            ${{ steps.image.outputs.namespace }}/cbt-pulse-grid-${{ matrix.image.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
