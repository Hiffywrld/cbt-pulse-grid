server:
  port: ${PORT:8081}
  address: 0.0.0.0

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:cbt_pulse_grid}
    username: ${POSTGRES_USER:cbt_admin}
    password: ${POSTGRES_PASSWORD:cbt_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  cors:
    allowed-origins: ${REST_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
  jwt:
    issuer: ${JWT_ISSUER:cbt-pulse-grid}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:15m}
    refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:7d}
    secret: ${JWT_SECRET:cbt-pulse-grid-local-development-secret-2026}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    force-reset: ${BOOTSTRAP_ADMIN_FORCE_RESET:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@cbtpulse.local}
    password: "${BOOTSTRAP_ADMIN_PASSWORD:Admin123!}"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  paths-to-match: /api/v1/auth/**,/api/v1/users/**,/api/v1/institutions/**
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
